name: Build Universal APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 采用通用标准打包，彻底绕过官方原作者的私有混淆拦截
      - name: Build with Gradle
        run: bash ./gradlew assembleUniversalDebug --no-daemon --stacktrace

      # 自动抓取生成好的通用 APK
      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: SmsForwarder-Custom-Universal-APK
          path: "**/build/**/apk/**/*.apk"
