name: Build Universal APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 自动创建本地签名证书，避免缺少官方私有 keystore 导致报错
      - name: Generate Keystore & Config
        run: |
          mkdir -p keystore
          keytool -genkey -v -keystore keystore/release.jks -alias smsf -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=SmsForwarder,OU=App,O=Dev,L=BJ,S=BJ,C=CN"
          cat << 'EOF' > keystore/keystore.properties
          storeFile=../keystore/release.jks
          storePassword=123456
          keyAlias=smsf
          keyPassword=123456
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: bash ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Universal Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SmsForwarder-Universal-Release
          path: app/build/outputs/apk/release/SmsF_*_universal_release.apk
